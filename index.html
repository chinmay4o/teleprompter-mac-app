<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; media-src *">
  <title>Teleprompter</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ─────────── Setup Screen ─────────── -->
  <div id="setup-screen" class="screen active">

    <div class="toolbar">
      <span class="app-title">Teleprompter</span>
      <div class="toolbar-controls">
        <button class="icon-btn" id="theme-btn" title="Toggle theme">☀️</button>
        <button class="icon-btn" id="pin-btn"   title="Always on top">📌</button>
        <div class="font-controls">
          <button class="icon-btn font-s" id="font-down-btn" title="Smaller">A</button>
          <span id="font-size-label">48</span>
          <button class="icon-btn font-l" id="font-up-btn"   title="Larger">A</button>
        </div>
      </div>
    </div>

    <div class="editor-wrap">
      <textarea id="script-input"
        placeholder="Paste or type your script here…"
        spellcheck="true"></textarea>
    </div>

    <div class="bottom-bar">
      <span id="word-count" class="dim">0 words</span>
      <div class="speed-row">
        <span class="dim">Speed</span>
        <input type="range" id="speed-slider" min="0.4" max="3" step="0.05" value="1">
        <span id="speed-label" class="dim">1.0×</span>
      </div>
      <button id="start-btn" class="start-btn" disabled>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2" width="6" height="12" rx="3"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="22"/>
          <line x1="8"  y1="22" x2="16" y2="22"/>
        </svg>
        Start
      </button>
    </div>

  </div>

  <!-- ─────────── Teleprompter Screen ─────────── -->
  <div id="teleprompter-screen" class="screen">

    <div id="reading-line"></div>

    <div id="scroll-container">
      <div id="scroll-wrapper">
        <p id="script-text"></p>
      </div>
    </div>

    <!-- Hover-reveal overlay (top-right) -->
    <div id="overlay">
      <div id="overlay-controls">
        <span class="dim overlay-label">Speed</span>
        <input type="range" id="overlay-speed" min="0.4" max="3" step="0.05" value="1">
        <span id="overlay-speed-label" class="dim">1.0×</span>
        <button class="ctrl-btn" id="reset-btn">↺&nbsp;Reset</button>
        <button class="ctrl-btn danger" id="stop-btn">✕&nbsp;Stop</button>
      </div>
      <div id="mic-dot" title="Microphone active"></div>
    </div>

    <!-- Keyboard hint (fades out after 3 s) -->
    <div id="kb-hint">Esc to stop &nbsp;·&nbsp; R to reset</div>

  </div>

  <script src="app.js"></script>
</body>
</html>
