// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children, isOpen: isOpenProp, onClose }) {
  const [openInternal, setOpenInternal] = React.useState(false);
  // If isOpenProp is provided, use it as controlled mode; otherwise use internal postMessage state
  const open = isOpenProp !== undefined ? isOpenProp : openInternal;
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    if (isOpenProp !== undefined) return; // controlled mode, skip postMessage
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpenInternal(true);
      else if (t === '__deactivate_edit_mode') setOpenInternal(false);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [isOpenProp]);

  const dismiss = () => {
    if (onClose) {
      onClose();
    } else {
      setOpenInternal(false);
      window.postMessage({ type: '__edit_mode_dismissed' }, '*');
    }
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

})();
</script>

// Tokenize body into a flat list of tokens.
// types: 'word' (carries text + global word index), 'space', 'break', 'cue' (label + index)
function tokenize(body) {
  const lines = body.split('\n');
  const tokens = [];
  let wi = 0;
  const cues = [];
  let prevWasContent = false;
  lines.forEach((raw) => {
    const line = raw.trim();
    if (!line) return; // blank line ignored (paragraphs are explicit lines)
    const cueMatch = line.match(/^\[\[(.+)\]\]$/);
    if (cueMatch) {
      const ci = cues.length;
      cues.push({ label: cueMatch[1], wordIndex: wi, tokenIndex: tokens.length });
      tokens.push({ type: 'cue', label: cueMatch[1], cueIndex: ci, wordIndex: wi });
      prevWasContent = false;
      return;
    }
    if (prevWasContent) tokens.push({ type: 'break' });
    const words = line.split(/\s+/);
    words.forEach((w, i) => {
      tokens.push({ type: 'word', text: w, wi });
      wi += 1;
      if (i < words.length - 1) tokens.push({ type: 'space' });
    });
    prevWasContent = true;
  });
  return { tokens, totalWords: wi, cues };
}

function wordCount(body) {
  return tokenize(body).totalWords;
}

// Estimated read time string at a given words-per-minute.
function readTime(body, wpm = 130) {
  const w = wordCount(body);
  const secs = Math.round((w / wpm) * 60);
  const m = Math.floor(secs / 60);
  const s = secs % 60;
  return `${m}:${String(s).padStart(2, '0')}`;
}

function fmtTime(secs) {
  secs = Math.max(0, Math.round(secs));
  const m = Math.floor(secs / 60);
  const s = secs % 60;
  return `${m}:${String(s).padStart(2, '0')}`;
}

Object.assign(window, { DEFAULT_SCRIPTS, tokenize, wordCount, readTime, fmtTime });

})();
</script>

        display: 'inline-flex', alignItems: 'center', gap: 6, padding: '6px 11px', cursor: 'pointer',
        borderRadius: 'var(--r-input)', border: 'none', fontFamily: 'var(--font-mono)', fontSize: 12.5,
        background: dark ? 'rgba(255,255,255,0.08)' : 'var(--surface-2)',
        color: dark ? 'rgba(255,255,255,0.85)' : 'var(--ink-1)',
      }}>
        <Icon name="flag" size={14} />{activeCue >= 0 ? cues[activeCue].label : 'Cues'}
        <Icon name="chevron" size={13} />
      </button>
      {open && (
        <div style={{
          position: 'absolute', bottom: 'calc(100% + 8px)', left: 0, minWidth: 200, zIndex: 50,
          background: dark ? '#1b1e28' : 'var(--surface)', border: dark ? '1px solid rgba(255,255,255,0.1)' : '1px solid var(--border)',
          borderRadius: 'var(--r-card)', boxShadow: 'var(--shadow-pop)', padding: 6,
        }}>
          {cues.map((c, i) => (
            <button key={i} onClick={() => { onJump(c.wordIndex); setOpen(false); }} style={{
              display: 'flex', alignItems: 'center', gap: 9, width: '100%', textAlign: 'left',
              border: 'none', cursor: 'pointer', padding: '7px 10px', borderRadius: 'var(--r-input)',
              background: i === activeCue ? (dark ? 'rgba(255,255,255,0.08)' : 'var(--accent-soft)') : 'transparent',
              color: i === activeCue ? (dark ? '#fff' : 'var(--accent)') : (dark ? 'rgba(255,255,255,0.8)' : 'var(--ink-1)'),
              fontFamily: 'var(--font-mono)', fontSize: 12.5,
            }}>
              <span style={{ color: dark ? 'rgba(255,255,255,0.4)' : 'var(--ink-3)', fontSize: 11, minWidth: 16 }}>{String(i + 1).padStart(2, '0')}</span>
              {c.label}

      )}

  );
}

// The transport HUD — floating control bar.
function TransportHUD({
  mode, onMode, playing, onPlay, onRestart,
  wpm, onWpm, fontSize, onFont,
  elapsed, total, fraction, fmt,
  cues, activeCue, onJumpCue, dark,
}) {
  const playBtn = {
    width: 46, height: 46, borderRadius: '50%', border: 'none', cursor: 'pointer',
    display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
    background: 'var(--accent)', color: '#fff', flexShrink: 0,
    transition: 'transform var(--dur-fast) var(--ease)',
  };
  const iconBtn = {
    width: 32, height: 32, borderRadius: 'var(--r-input)', border: 'none', cursor: 'pointer',
    display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
    background: dark ? 'rgba(255,255,255,0.08)' : 'var(--surface-2)',
    color: dark ? 'rgba(255,255,255,0.85)' : 'var(--ink-1)',
  };
  return (
    <div style={{
      display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 9, padding: '9px 13px',
      borderRadius: 18, flexWrap: 'wrap', maxWidth: '100%', rowGap: 8,
      background: dark ? 'rgba(22,25,34,0.86)' : 'var(--surface)',
      border: dark ? '1px solid rgba(255,255,255,0.1)' : '1px solid var(--border)',
      boxShadow: 'var(--shadow-pop)',
      backdropFilter: dark ? 'blur(12px)' : 'none', WebkitBackdropFilter: dark ? 'blur(12px)' : 'none',
    }}>
      <Segmented value={mode} onChange={onMode} dark={dark}
        options={[
          { value: 'voice', label: 'Voice', icon: 'mic' },
          { value: 'auto', label: 'Auto', icon: 'gauge' },
          { value: 'manual', label: 'Manual', icon: 'list' },
        ]} />

      <Divider dark={dark} />

      <button style={iconBtn} onClick={onRestart} title="Restart (R)"><Icon name="restart" size={16} /></button>
      <button style={playBtn} onClick={onPlay} title="Play / pause (Space)"
        onMouseDown={(e) => e.currentTarget.style.transform = 'scale(0.94)'}
        onMouseUp={(e) => e.currentTarget.style.transform = 'scale(1)'}>
        <Icon name={playing ? 'pause' : 'play'} size={20} />
      </button>

      <Divider dark={dark} />

      {mode === 'manual'
        ? <span style={{ fontFamily: 'var(--font-mono)', fontSize: 12, color: dark ? 'rgba(255,255,255,0.55)' : 'var(--ink-3)', minWidth: 120, textAlign: 'center' }}>scroll / ↑ ↓ to move</span>
        : <Stepper icon="gauge" label={`${wpm}`} dark={dark}
            onDec={() => onWpm(Math.max(60, wpm - 10))} onInc={() => onWpm(Math.min(260, wpm + 10))} />
      }

      <Stepper icon="type" label={`${fontSize}`} dark={dark}
        onDec={() => onFont(Math.max(28, fontSize - 4))} onInc={() => onFont(Math.min(96, fontSize + 4))} />

      <Divider dark={dark} />

      {/* time + progress */}
      <div style={{ display: 'flex', flexDirection: 'column', gap: 5, minWidth: 116 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', fontFamily: 'var(--font-mono)',
          fontSize: 11.5, color: dark ? 'rgba(255,255,255,0.7)' : 'var(--ink-2)' }}>
          <span style={{ color: dark ? '#fff' : 'var(--ink-1)' }}>{fmt(elapsed)}</span>
          <span>{fmt(total)}</span>
        </div>
        <div style={{ height: 3, borderRadius: 2, background: dark ? 'rgba(255,255,255,0.14)' : 'var(--surface-3)' }}>
          <div style={{ width: `${Math.round(fraction * 100)}%`, height: '100%', borderRadius: 2, background: 'var(--accent)' }} />
        </div>
      </div>

      <CueMenu cues={cues} activeCue={activeCue} onJump={onJumpCue} dark={dark} />
    </div>
  );
}

Object.assign(window, { Segmented, Stepper, CueMenu, TransportHUD });

})();
</script>

<script type="text/babel" data-presets="react">
;(function(){
/* global React */
// PrompterCanvas — the scrolling reading engine, shared by the on-screen
// prompter and the recording overlay.
//
// Continuous pixel-smooth scroll driven by a rAF loop (transform mutated
// directly, not via React state). Word highlighting tracks the focus line.
// Voice mode simulates speech tracking: the scroll speeds, drifts and pauses
// like a real speaker, with a live mic-level meter reflecting the envelope.

const { useRef, useState, useEffect, useLayoutEffect, useImperativeHandle, forwardRef } = React;

const PrompterCanvas = forwardRef(function PrompterCanvas(props, ref) {
  const {
    tokens, totalWords, cues,
    wpm = 130, mode = 'voice', playing = false,
    mirrorH = false, mirrorV = false,
    fontSize = 52, lineHeight = 1.45, weight = 600,
    align = 'left', maxWidth = 18, // maxWidth in em
    focusStyle = 'line', focusColor = 'var(--accent)', focusPct = 0.42,
    variant = 'screen',
    onProgress, onActiveCue, onEnd,
  } = props;

  const viewportRef = useRef(null);
  const scrollerRef = useRef(null);
  const wordEls = useRef([]);
  const topsRef = useRef([]);        // natural top of each word within scroller content (excl. padding)
  const rangeRef = useRef(1);        // scroll range in px
  const posRef = useRef(0);          // current scroll position px
  const lastActiveRef = useRef(-1);
  const lastCueRef = useRef(-1);
  const rafRef = useRef(0);
  const lastTsRef = useRef(0);
  const micRef = useRef(0.4);
  const envRef = useRef({ pauseUntil: 0, nextPauseAt: 1.5, drift: 1, t: 0 });
  const audioRef = useRef(null);     // { ctx, analyser, data, stream } when mic is live
  const lvlRef = useRef(0);          // smoothed RMS level
  const speakFactorRef = useRef(0);  // smoothed scroll factor from voice activity
  const meterBars = useRef([]);
  const lastProgressRef = useRef(0);
  const wordRefCbs = useRef({});
  function wordRef(i) {
    if (!wordRefCbs.current[i]) wordRefCbs.current[i] = (el) => { wordEls.current[i] = el; };
    return wordRefCbs.current[i];
  }

  const playingRef = useRef(playing);
  const modeRef = useRef(mode);
  const wpmRef = useRef(wpm);
  useEffect(() => { playingRef.current = playing; }, [playing]);
  useEffect(() => { modeRef.current = mode; }, [mode]);
  useEffect(() => { wpmRef.current = wpm; }, [wpm]);

  // ---- real microphone capture for voice mode (VAD pacing) ----
  // Opens the mic only while voice mode is actually playing, wires it into a
  // Web Audio analyser, and tears everything down on pause/unmount.
  useEffect(() => {
    if (!(mode === 'voice' && playing)) return;
    let cancelled = false;
    (async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        if (cancelled) { stream.getTracks().forEach(t => t.stop()); return; }
        const Ctx = window.AudioContext || window.webkitAudioContext;
        const ctx = new Ctx();
        if (ctx.state === 'suspended') ctx.resume().catch(() => {});
        const src = ctx.createMediaStreamSource(stream);
        const analyser = ctx.createAnalyser();
        analyser.fftSize = 512;
        analyser.smoothingTimeConstant = 0.85;
        src.connect(analyser);
        audioRef.current = { ctx, analyser, data: new Uint8Array(analyser.fftSize), stream };
      } catch (e) {
        // mic blocked/unavailable → loop falls back to steady auto-scroll
        audioRef.current = null;
      }
    })();
    return () => {
      cancelled = true;
      const a = audioRef.current;
      if (a) {
        if (a.stream) a.stream.getTracks().forEach(t => t.stop());
        if (a.ctx) a.ctx.close().catch(() => {});
      }
      audioRef.current = null;
      lvlRef.current = 0;
      speakFactorRef.current = 0;
    };
  }, [mode, playing]);

  // Current mic loudness as RMS (0..~1), or null if the mic isn't live.
  function readLevel() {
    const a = audioRef.current;
    if (!a || !a.analyser) return null;
    a.analyser.getByteTimeDomainData(a.data);
    let sum = 0;
    for (let i = 0; i < a.data.length; i++) {
      const v = (a.data[i] - 128) / 128;
      sum += v * v;
    }
    return Math.sqrt(sum / a.data.length);
  }

  const isCamera = variant === 'camera';

  // ---- measure word tops ----
  function measure() {
    const vp = viewportRef.current;
    if (!vp) return;
    const focusY = vp.clientHeight * focusPct;
    const padTop = focusY;
    const sc = scrollerRef.current;
    if (sc) sc.style.paddingTop = padTop + 'px';
    const tops = [];
    const els = wordEls.current;
    for (let i = 0; i < els.length; i++) {
      const el = els[i];
      tops[i] = el ? el.offsetTop - padTop : 0; // natural top (relative to first line)
    }
    topsRef.current = tops;
    rangeRef.current = Math.max(1, tops[tops.length - 1] || 1);
    applyTransform();
  }

  function applyTransform() {
    const sc = scrollerRef.current;
    if (!sc) return;
    sc.style.transform = `translateY(${-posRef.current}px)`;
  }

  function findActive(pos, focusY) {
    const tops = topsRef.current;
    const target = pos; // word natural top that is at the focus line
    // largest i with tops[i] <= target
    let lo = 0, hi = tops.length - 1, ans = 0;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (tops[mid] <= target) { ans = mid; lo = mid + 1; } else { hi = mid - 1; }
    }
    return ans;
  }

  function applyActive(active) {
    const last = lastActiveRef.current;
    if (active === last) return;
    const els = wordEls.current;
    const a = Math.min(last < 0 ? active : last, active);
    const b = Math.max(last < 0 ? active : last, active);
    for (let i = a; i <= b; i++) {
      const el = els[i];
      if (!el) continue;
      el.className = 'prompt-word' + (i < active ? ' is-read' : i === active ? ' is-active' : '');
    }
    // ensure the boundary words always correct
    if (els[active]) els[active].className = 'prompt-word is-active';
    lastActiveRef.current = active;

    // cue tracking
    if (cues && cues.length && onActiveCue) {
      let ci = -1;
      for (let k = 0; k < cues.length; k++) { if (cues[k].wordIndex <= active) ci = k; else break; }
      if (ci !== lastCueRef.current) { lastCueRef.current = ci; onActiveCue(ci); }
    }
  }

  function updateMeter() {
    const bars = meterBars.current;
    const base = micRef.current;
    for (let i = 0; i < bars.length; i++) {
      const el = bars[i];
      if (!el) continue;
      const jitter = 0.35 + 0.65 * Math.abs(Math.sin(Date.now() / (90 + i * 37) + i));
      const h = Math.max(0.12, base * jitter);
      el.style.transform = `scaleY(${h.toFixed(3)})`;
    }
  }

  function loop(ts) {
    const vp = viewportRef.current;
    if (!vp) return;
    if (!lastTsRef.current) lastTsRef.current = ts;
    let dt = (ts - lastTsRef.current) / 1000;
    lastTsRef.current = ts;
    if (dt > 0.1) dt = 0.1;

    const focusY = vp.clientHeight * focusPct;
    const range = rangeRef.current;
    const totalSecs = Math.max(1, (totalWords / Math.max(40, wpmRef.current)) * 60);
    const baseV = range / totalSecs; // px/s for steady reading

    const env = envRef.current;
    env.t += dt;
    let factor = 0;
    if (playingRef.current && modeRef.current !== 'manual') {
      if (modeRef.current === 'voice') {

        // hold the line when they pause. Driven by live mic RMS.
        const rms = readLevel();
        if (rms == null) {
          // no mic (denied/unavailable) → steady auto-scroll fallback
          factor = 1;
          micRef.current += (0 - micRef.current) * Math.min(1, dt * 8);
        } else {
          lvlRef.current += (rms - lvlRef.current) * Math.min(1, dt * 10);
          const lvl = lvlRef.current;
          const floor = 0.04; // noise floor — below this we treat it as silence
          const speaking = lvl > floor;
          // meter reflects actual loudness
          micRef.current += (Math.min(1, lvl * 7) - micRef.current) * Math.min(1, dt * 14);
          // speaking advances the scroll (louder = slightly faster); silence pauses it
          const target = speaking ? Math.min(1.5, 0.75 + (lvl - floor) * 9) : 0;
          speakFactorRef.current += (target - speakFactorRef.current) * Math.min(1, dt * 6);
          factor = speakFactorRef.current;
        }
      } else {
        factor = 1;
        micRef.current += (0 - micRef.current) * Math.min(1, dt * 8);
      }
      posRef.current += baseV * factor * dt;
      if (posRef.current >= range) {
        posRef.current = range;
        if (onEnd) onEnd();
      }
    } else {
      micRef.current += (0 - micRef.current) * Math.min(1, dt * 8);
    }

    applyTransform();
    const active = findActive(posRef.current, focusY);
    applyActive(active);
    if (modeRef.current === 'voice') updateMeter();

    // throttled progress callback (~8/s)
    if (ts - lastProgressRef.current > 120 && onProgress) {
      lastProgressRef.current = ts;
      const frac = Math.min(1, posRef.current / range);
      onProgress(frac, frac * totalSecs, totalSecs, active);
    }
  }

  useEffect(() => {
    // Timer-driven tick (works even where rAF is suspended). performance.now()
    // keeps motion time-correct regardless of tick cadence.
    let alive = true;
    const id = setInterval(() => { if (alive) loop(performance.now()); }, 1000 / 60);
    rafRef.current = id;
    return () => { alive = false; clearInterval(id); };

    measure();
    // eslint-disable-next-line
  }, [tokens, fontSize, lineHeight, weight, align, maxWidth, mirrorH, mirrorV, variant, focusPct]);

    e.preventDefault();
    posRef.current = Math.max(0, Math.min(rangeRef.current, posRef.current + e.deltaY));
    applyTransform();
    const focusY = (viewportRef.current.clientHeight) * focusPct;
    applyActive(findActive(posRef.current, focusY));
  }

  useImperativeHandle(ref, () => ({
    seekWord(i) {
      const tops = topsRef.current;
      if (tops[i] == null) return;
      posRef.current = Math.max(0, Math.min(rangeRef.current, tops[i]));
      applyTransform();
      const focusY = viewportRef.current.clientHeight * focusPct;
      applyActive(findActive(posRef.current, focusY));

    restart() {
      posRef.current = 0; lastActiveRef.current = -1; lastCueRef.current = -1;

    : { '--up': 'color-mix(in srgb, var(--ink-1) 88%, transparent)', '--read': 'var(--ink-3)', '--act': 'var(--ink-1)' };

  const content = tokens.map((tk, idx) => {
    if (tk.type === 'space') return ' ';
    if (tk.type === 'break') return <div key={'b' + idx} style={{ height: '0.7em' }} />;
    if (tk.type === 'cue') {

        <div key={'c' + idx} style={{
          display: 'flex', alignItems: 'center', gap: 10, margin: '0.15em 0 0.35em',
          opacity: 0.9,

          <span style={{
            fontFamily: 'var(--font-mono)', fontSize: '0.34em', fontWeight: 700,
            letterSpacing: '0.14em', textTransform: 'uppercase',
            padding: '0.25em 0.7em', borderRadius: 999,
            color: isCamera ? '#fff' : 'var(--accent)',
            background: isCamera ? 'rgba(255,255,255,0.14)' : 'var(--accent-soft)',
            border: isCamera ? '1px solid rgba(255,255,255,0.22)' : '1px solid transparent',
          }}>{tk.label}</span>
          <span style={{ flex: 1, height: 1, background: isCamera ? 'rgba(255,255,255,0.18)' : 'var(--border)' }} />
        </div>
      );
    }
    // word
    wi = tk.wi;
    const myIndex = tk.wi;
    return (
      <span key={'w' + idx} ref={wordRef(myIndex)} className="prompt-word">{tk.text}</span>
    );
  });

  return (
    <div
      ref={viewportRef}
      onWheel={onWheel}
      style={{
        position: 'relative', width: '100%', height: '100%', overflow: 'hidden',
        ...colorVars,
        WebkitMaskImage: 'linear-gradient(to bottom, transparent 0%, #000 11%, #000 84%, transparent 100%)',
        maskImage: 'linear-gradient(to bottom, transparent 0%, #000 11%, #000 84%, transparent 100%)',
      }}>
      {/* scroller */}
      <div
        ref={scrollerRef}
        style={{
          willChange: 'transform',
          paddingBottom: '60vh',
          margin: '0 auto',
          maxWidth: maxWidth + 'em',
          fontFamily: 'var(--font-mono)',
          fontSize: fontSize + 'px',
          lineHeight: lineHeight,
          fontWeight: weight,
          textAlign: align,
          letterSpacing: '-0.01em',
          textWrap: 'pretty',
          transform: `scaleX(${mirrorH ? -1 : 1}) scaleY(${mirrorV ? -1 : 1})`,
          transformOrigin: 'center',
        }}>
        {content}
      </div>

      {/* focus indicator */}
      <FocusIndicator style={focusStyle} color={focusColor} pct={focusPct} isCamera={isCamera} />

      {/* voice meter — "listening" indicator */}
      {mode === 'voice' && (
        <div style={{
          position: 'absolute', top: 14, right: 18,
          display: 'flex', alignItems: 'center', gap: 8,
          padding: '5px 11px 5px 10px', borderRadius: 999,
          background: isCamera ? 'rgba(0,0,0,0.4)' : 'var(--surface-2)',
          border: isCamera ? '1px solid rgba(255,255,255,0.16)' : '1px solid var(--border)',
          pointerEvents: 'none', opacity: playing ? 1 : 0.5, transition: 'opacity 200ms',
        }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 2.5, height: 16 }}>
            {Array.from({ length: 9 }).map((_, i) => (
              <span key={i} ref={(el) => { meterBars.current[i] = el; }} style={{
                width: 2.5, height: 16, borderRadius: 2, transformOrigin: 'center',
                transform: 'scaleY(0.2)',
                background: isCamera ? 'rgba(255,255,255,0.9)' : 'var(--accent)',
              }} />
            ))}
          </div>
          <span style={{ fontFamily: 'var(--font-mono)', fontSize: 10.5, fontWeight: 600,
            letterSpacing: '0.1em', textTransform: 'uppercase',
            color: isCamera ? 'rgba(255,255,255,0.85)' : 'var(--accent)' }}>
            {playing ? 'Listening' : 'Voice'}
          </span>
        </div>
      )}
    </div>
  );
});

function FocusIndicator({ style, color, pct, isCamera }) {
  if (style === 'off') return null;
  const top = `calc(${pct * 100}% )`;
  const lineColor = isCamera ? 'rgba(255,255,255,0.5)' : color;
  if (style === 'bar') {
    return <div style={{
      position: 'absolute', left: 0, right: 0, top,
      transform: 'translateY(-50%)', height: '1.5em',
      background: isCamera ? 'rgba(255,255,255,0.07)' : 'var(--accent-faint)',
      borderTop: `1px solid ${lineColor}`, borderBottom: `1px solid ${lineColor}`,
      pointerEvents: 'none',
    }} />;
  }
  if (style === 'arrows') {
    const tri = (dir) => (
      <span style={{
        width: 0, height: 0,
        borderTop: '9px solid transparent', borderBottom: '9px solid transparent',
        [dir === 'l' ? 'borderLeft' : 'borderRight']: `13px solid ${lineColor}`,
      }} />
    );
    return <div style={{
      position: 'absolute', left: 0, right: 0, top, transform: 'translateY(-50%)',
      display: 'flex', justifyContent: 'space-between', padding: '0 10px', pointerEvents: 'none',
    }}>{tri('r')}{tri('l')}</div>;
  }
  // line
  return <div style={{
    position: 'absolute', left: '6%', right: '6%', top, height: 2,
    transform: 'translateY(-50%)', background: lineColor, borderRadius: 2,
    pointerEvents: 'none', opacity: 0.85,
  }} />;
}

Object.assign(window, { PrompterCanvas });

})();
</script>

<script type="text/babel" data-presets="react">

function snippet(body) {
  const text = body.split('\n').map(l => l.trim()).filter(l => l && !/^\[\[.+\]\]$/.test(l)).join(' ');
  return text.length > 132 ? text.slice(0, 132).trimEnd() + '…' : text;
}

function NewScriptModal({ onSave, onCancel }) {
  const { useState: useStateNS } = React;
  const [title, setTitle] = useStateNS('');
  const [folder, setFolder] = useStateNS('');
  const [body, setBody] = useStateNS('');
  const [accent, setAccent] = useStateNS('lavender');

  const handleSave = () => {
    if (!title.trim() || !body.trim()) return;
    onSave({ title: title.trim(), folder: folder.trim() || 'My Scripts', body: body.trim(), accent });
  };

  const inputStyle = {
    fontFamily: 'var(--font-mono)', fontSize: 13.5, padding: '9px 12px',
    borderRadius: 'var(--r-input)', border: '1px solid var(--border)',
    background: 'var(--surface)', color: 'var(--ink-1)', outline: 'none', width: '100%',
    boxSizing: 'border-box', transition: 'border-color var(--dur-fast)',
  };

  return (
    <div style={{
      position: 'fixed', inset: 0, zIndex: 200,
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      background: 'rgba(0,0,0,0.45)',
    }}>
      <div style={{
        width: 580, background: 'var(--surface)', borderRadius: 12,
        border: '1px solid var(--border)', padding: 28, boxShadow: 'var(--shadow-pop)',
        display: 'flex', flexDirection: 'column', gap: 16,

        <div>
          <h2 style={{ margin: '0 0 4px', fontFamily: 'var(--font-mono)', fontWeight: 700, fontSize: 18, color: 'var(--ink-1)' }}>New script</h2>
          <p style={{ margin: 0, fontFamily: 'var(--font-mono)', fontSize: 12.5, color: 'var(--ink-3)' }}>
            Use <code style={{ background: 'var(--surface-3)', padding: '1px 5px', borderRadius: 4, fontSize: 12 }}>[[Cue label]]</code> on its own line to add jump points.
          </p>
        </div>

        <div style={{ display: 'flex', gap: 10 }}>
          <div style={{ flex: 2 }}>

              placeholder="e.g. Product launch script"

            <label style={{ fontFamily: 'var(--font-mono)', fontSize: 11.5, fontWeight: 600, color: 'var(--ink-3)', display: 'block', marginBottom: 5 }}>FOLDER</label>

        <div>
          <label style={{ fontFamily: 'var(--font-mono)', fontSize: 11.5, fontWeight: 600, color: 'var(--ink-3)', display: 'block', marginBottom: 5 }}>SCRIPT</label>
          <textarea value={body} onChange={e => setBody(e.target.value)}
            placeholder={'[[Intro]]\nYour script goes here...\n\n[[Section 2]]\nKeep each paragraph on its own line for best results.'}
            style={{ ...inputStyle, height: 200, resize: 'vertical', lineHeight: 1.7 }} />
        </div>

        <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
          <div style={{ fontFamily: 'var(--font-mono)', fontSize: 11.5, fontWeight: 600, color: 'var(--ink-3)' }}>COLOR</div>
          <div style={{ display: 'flex', gap: 6 }}>
            {ACCENT_OPTIONS.map(a => (
              <button key={a} onClick={() => setAccent(a)} style={{

function LibraryScreen({ scripts, wpm, onOpen, onRecord, onAddScript, onDeleteScript }) {
  const [filter, setFilter] = useStateLib('all');
  const [query, setQuery] = useStateLib('');
  const [favs, setFavs] = useStateLib(() => Object.fromEntries(scripts.map(s => [s.id, s.favorite])));
  const [newOpen, setNewOpen] = useStateLib(false);

  // sync favs when scripts list changes (e.g. new script added)
  React.useEffect(() => {
    setFavs(prev => {
      const next = { ...prev };
      scripts.forEach(s => { if (!(s.id in next)) next[s.id] = s.favorite || false; });
      return next;
    });
  }, [scripts]);

  const folders = useMemoLib(() => {
    const set = [];
    scripts.forEach(s => { if (!set.includes(s.folder)) set.push(s.folder); });
    return set;
  }, [scripts]);

  const counts = useMemoLib(() => {
    const c = { all: scripts.length, fav: scripts.filter(s => favs[s.id]).length };
    folders.forEach(f => c[f] = scripts.filter(s => s.folder === f).length);
    return c;
  }, [favs, folders, scripts]);

  const list = scripts.filter(s => {
    if (filter === 'fav' && !favs[s.id]) return false;
    if (filter !== 'all' && filter !== 'fav' && s.folder !== filter) return false;
    if (query && !(s.title + ' ' + s.body + ' ' + s.folder).toLowerCase().includes(query.toLowerCase())) return false;
    return true;
  });

  const navItem = (id, label, count) => {
    const active = filter === id;
    return (
      <button key={id} onClick={() => setFilter(id)} style={{
        display: 'flex', alignItems: 'center', gap: 10, width: '100%', textAlign: 'left',
        border: 'none', borderRadius: 'var(--r-input)', padding: '7px 11px', cursor: 'pointer',
        background: active ? 'var(--accent-soft)' : 'transparent',
        color: active ? 'var(--accent)' : 'var(--ink-1)',
        fontFamily: 'var(--font-mono)', fontSize: 13, fontWeight: active ? 600 : 500,
        transition: 'background var(--dur-fast) var(--ease)',
      }}>
        <span style={{ flex: 1 }}>{label}</span>
        <span style={{ color: active ? 'var(--accent)' : 'var(--ink-3)', fontSize: 12 }}>{count}</span>
      </button>
    );
  };

  const handleNewScript = (data) => {
    const newScript = {
      id: 'user-' + Date.now(),
      title: data.title,
      folder: data.folder,
      body: data.body,
      accent: data.accent,
      status: 'draft',
      favorite: false,
      updated: 'Just now',
    };
    onAddScript(newScript);
    setNewOpen(false);
    // Switch filter to show the new script's folder
    setFilter(data.folder || 'My Scripts');
  };

  return (
    <div style={{ display: 'flex', height: '100%', minHeight: 0 }}>
      {/* sidebar */}
      <aside style={{
        width: 208, flexShrink: 0, borderRight: '1px solid var(--border)',
        padding: '18px 12px', display: 'flex', flexDirection: 'column', gap: 4,
        background: 'var(--paper)', overflowY: 'auto',
      }}>
        <Eyebrow style={{ padding: '4px 11px 8px' }}>Library</Eyebrow>
        {navItem('all', 'All scripts', counts.all)}
        {navItem('fav', '★ Favorites', counts.fav)}
        <Eyebrow style={{ padding: '18px 11px 8px' }}>Folders</Eyebrow>
        {folders.map(f => navItem(f, f, counts[f]))}
        <div style={{ flex: 1 }} />
        <button style={{
          display: 'flex', alignItems: 'center', gap: 8, background: 'transparent', border: 'none',
          color: 'var(--ink-2)', fontFamily: 'var(--font-mono)', fontSize: 12.5, cursor: 'pointer',
          padding: '7px 11px', textAlign: 'left',
        }} onClick={() => setNewOpen(true)}>
          <Icon name="plus" size={14} /> New folder
        </button>
      </aside>

      {/* main */}
      <div style={{ flex: 1, minWidth: 0, display: 'flex', flexDirection: 'column' }}>
        {/* toolbar */}
        <div style={{
          display: 'flex', alignItems: 'center', gap: 14, padding: '16px 28px',
          borderBottom: '1px solid var(--border)',
        }}>
          <div>
            <h1 style={{ margin: 0, fontFamily: 'var(--font-mono)', fontWeight: 700, fontSize: 19, color: 'var(--ink-1)' }}>
              {filter === 'all' ? 'All scripts' : filter === 'fav' ? 'Favorites' : filter}
            </h1>
            <div style={{ fontFamily: 'var(--font-mono)', fontSize: 12, color: 'var(--ink-3)', marginTop: 2 }}>
              {list.length} {list.length === 1 ? 'script' : 'scripts'}
            </div>
          </div>
          <div style={{ flex: 1, maxWidth: 360, marginLeft: 'auto' }}>
            <div style={{
              display: 'flex', alignItems: 'center', gap: 8, border: '1px solid var(--border)',
              background: 'var(--surface)', borderRadius: 'var(--r-input)', padding: '7px 12px',
            }}>
              <Icon name="search" size={15} style={{ color: 'var(--ink-3)' }} />
              <input value={query} onChange={(e) => setQuery(e.target.value)}
                placeholder="Search scripts…"
                style={{ flex: 1, border: 'none', outline: 'none', background: 'transparent',
                  fontFamily: 'var(--font-mono)', fontSize: 13, color: 'var(--ink-1)' }} />
            </div>
          </div>
          <Button onClick={() => setNewOpen(true)}><Icon name="plus" size={15} /> New script</Button>
        </div>

        {/* grid */}
        <div style={{ flex: 1, overflowY: 'auto', padding: '22px 28px 40px' }}>
          <div style={{
            display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(296px, 1fr))', gap: 16,
          }}>
            {list.map(s => (
              <ScriptCard key={s.id} s={s} wpm={wpm}
                fav={!!favs[s.id]}
                onFav={() => setFavs(f => ({ ...f, [s.id]: !f[s.id] }))}
                onOpen={() => onOpen(s)} onRecord={() => onRecord(s)}
                onDelete={onDeleteScript ? () => onDeleteScript(s.id) : null} />

          </div>

            <div style={{ padding: '80px 0', textAlign: 'center', color: 'var(--ink-3)',

              {query ? `No scripts match "${query}".` : 'No scripts here yet.'}
            </div>
          )}
        </div>
      </div>

      {newOpen && <NewScriptModal onSave={handleNewScript} onCancel={() => setNewOpen(false)} />}
    </div>
  );
}

      <div style={{ fontFamily: 'var(--font-mono)', fontSize: 12.5, lineHeight: 1.65, color: 'var(--ink-2)',
        flex: 1, display: '-webkit-box', WebkitLineClamp: 3, WebkitBoxOrient: 'vertical', overflow: 'hidden' }}>
        {snippet(s.body)}
      </div>

      <div style={{ display: 'flex', alignItems: 'center', gap: 12, fontFamily: 'var(--font-mono)',

        </span>
        <div style={{ flex: 1 }} />
        <StatusTag status={s.status} />
      </div>

      {/* hover actions */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 'var(--r-card)',
        display: 'flex', alignItems: 'flex-end', justifyContent: 'flex-end', gap: 8, padding: 16,
        opacity: hover ? 1 : 0, pointerEvents: hover ? 'auto' : 'none',
        background: 'linear-gradient(to top, color-mix(in srgb, var(--surface) 82%, transparent), transparent 46%)',
        transition: 'opacity var(--dur-base) var(--ease)',
      }}>
        {onDelete && (
          <button onClick={(e) => { e.stopPropagation(); onDelete(); }} style={{
            background: 'transparent', border: 'none', cursor: 'pointer', padding: '4px 6px',
            color: 'var(--ink-3)', display: 'flex', borderRadius: 'var(--r-input)',
            marginRight: 'auto',
          }} title="Delete script">
            <Icon name="square" size={15} />
          </button>
        )}
        <Button variant="ghost" size="sm" onClick={(e) => { e.stopPropagation(); onOpen(); }}>
          <Icon name="eye" size={14} /> Prompter

        <Button size="sm" onClick={(e) => { e.stopPropagation(); onRecord(); }}>
          <Icon name="record" size={12} /> Record
        </Button>
      </div>
    </div>
  );
}

Object.assign(window, { LibraryScreen });

})();
</script>

<script type="text/babel" data-presets="react">
;(function(){
/* global React, Icon, IconButton, Button, Pill, PrompterCanvas, TransportHUD, tokenize, fmtTime */
// ReaderScreen — full-window on-screen teleprompter. Follows the app theme
// (warm paper in light, near-black in dark). Floating transport HUD.

const { useState: useStateRd, useEffect: useEffectRd, useRef: useRefRd, useMemo: useMemoRd } = React;

function useKeyboard(session, setSession, canvasRef) {
  useEffectRd(() => {
    const onKey = (e) => {
      if (e.target && /input|textarea/i.test(e.target.tagName)) return;
      if (e.code === 'Space') { e.preventDefault(); setSession(s => ({ ...s, playing: !s.playing })); }
      else if (e.code === 'KeyR') { canvasRef.current && canvasRef.current.restart(); setSession(s => ({ ...s, playing: false })); }
      else if (e.code === 'KeyM') { setSession(s => ({ ...s, mirrorH: !s.mirrorH })); }
      else if (e.code === 'ArrowDown') { e.preventDefault(); canvasRef.current && canvasRef.current.nudge(60); }
      else if (e.code === 'ArrowUp') { e.preventDefault(); canvasRef.current && canvasRef.current.nudge(-60); }
      else if (e.code === 'ArrowRight') { setSession(s => ({ ...s, wpm: Math.min(260, s.wpm + 10) })); }
      else if (e.code === 'ArrowLeft') { setSession(s => ({ ...s, wpm: Math.max(60, s.wpm - 10) })); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [setSession, canvasRef]);
}

function ReaderScreen({ script, session, setSession, tweaks, onBack, onRecord }) {
  const canvasRef = useRefRd(null);
  const data = useMemoRd(() => tokenize(script.body), [script]);
  const [prog, setProg] = useStateRd({ frac: 0, elapsed: 0, total: 1, cue: -1 });
  useKeyboard(session, setSession, canvasRef);

  return (
    <div style={{ position: 'relative', height: '100%', display: 'flex', flexDirection: 'column',
      background: 'var(--paper)', minHeight: 0 }}>
      {/* top bar */}
      <div style={{
        display: 'flex', alignItems: 'center', gap: 14, padding: '12px 18px', zIndex: 10,
        borderBottom: '1px solid var(--border-faint)',
      }}>
        <IconButton name="back" title="Back to library" onClick={onBack} />
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, minWidth: 0 }}>
          <Pill tone={script.accent} size="sm">{script.folder}</Pill>
          <span style={{ fontFamily: 'var(--font-mono)', fontWeight: 700, fontSize: 14, color: 'var(--ink-1)',
            whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{script.title}</span>
        </div>
        <div style={{ flex: 1 }} />
        <div style={{ display: 'inline-flex', padding: 3, borderRadius: 'var(--r-pill)', gap: 2,
          background: 'var(--surface-3)', border: '1px solid var(--border-faint)' }}>
          {[{ id: 'reader', label: 'Prompter', icon: 'eye' }, { id: 'record', label: 'Record', icon: 'record' }].map(t => {
            const active = t.id === 'reader';
            return <button key={t.id} onClick={() => { if (t.id === 'record') onRecord(); }} style={{
              display: 'inline-flex', alignItems: 'center', gap: 6, border: 'none', cursor: 'pointer',
              padding: '5px 13px', borderRadius: 'var(--r-pill)', fontFamily: 'var(--font-mono)', fontSize: 12.5,
              fontWeight: active ? 600 : 500,
              background: active ? 'var(--surface)' : 'transparent', color: active ? 'var(--ink-1)' : 'var(--ink-2)',
              boxShadow: active ? 'var(--shadow-float)' : 'none',
            }}><Icon name={t.icon} size={13} />{t.label}</button>;
          })}
        </div>
        <IconButton name="mirror" title="Mirror (M)" active={session.mirrorH} onClick={() => setSession(s => ({ ...s, mirrorH: !s.mirrorH }))} />
      </div>

      {/* prompter */}
      <div style={{ flex: 1, minHeight: 0, position: 'relative' }}>
        <PrompterCanvas
          ref={canvasRef}
          tokens={data.tokens} totalWords={data.totalWords} cues={data.cues}
          wpm={session.wpm} mode={session.mode} playing={session.playing}
          mirrorH={session.mirrorH} mirrorV={session.mirrorV}
          fontSize={session.fontSize} lineHeight={tweaks.lineHeight}
          align={tweaks.align} maxWidth={tweaks.maxWidth}
          focusStyle={tweaks.focusStyle} focusColor={tweaks.focusColor} focusPct={tweaks.focusPct}
          variant="screen"
          onProgress={(frac, el, tot, active) => setProg(p => ({ ...p, frac, elapsed: el, total: tot }))}
          onActiveCue={(ci) => setProg(p => ({ ...p, cue: ci }))}
          onEnd={() => setSession(s => ({ ...s, playing: false }))}
        />
      </div>

      {/* transport */}
      <div style={{ position: 'absolute', left: 0, right: 0, bottom: 18, display: 'flex', justifyContent: 'center', zIndex: 20 }}>
        <TransportHUD
          mode={session.mode} onMode={(m) => setSession(s => ({ ...s, mode: m }))}
          playing={session.playing} onPlay={() => setSession(s => ({ ...s, playing: !s.playing }))}
          onRestart={() => { canvasRef.current && canvasRef.current.restart(); setSession(s => ({ ...s, playing: false })); }}
          wpm={session.wpm} onWpm={(w) => setSession(s => ({ ...s, wpm: w }))}
          fontSize={session.fontSize} onFont={(f) => setSession(s => ({ ...s, fontSize: f }))}
          elapsed={prog.elapsed} total={prog.total} fraction={prog.frac} fmt={fmtTime}
          cues={data.cues} activeCue={prog.cue}
          onJumpCue={(wi) => canvasRef.current && canvasRef.current.seekWord(wi)}
          dark={false}
        />
      </div>
    </div>
  );
}

Object.assign(window, { ReaderScreen, useKeyboard });

})();
</script>

<script type="text/babel" data-presets="react">
;(function(){
/* global React, Icon, IconButton, Button, Pill, PrompterCanvas, TransportHUD, useKeyboard, tokenize, fmtTime */
// RecordingScreen — camera preview with the prompter overlaid near the lens.

const { useState: useStateRec, useEffect: useEffectRec, useRef: useRefRec, useMemo: useMemoRec } = React;

const ASPECTS = [
  { id: '16:9', label: '16:9', ratio: 16 / 9 },
  { id: '9:16', label: '9:16', ratio: 9 / 16 },
  { id: '1:1', label: '1:1', ratio: 1 },
];

function RecordingScreen({ script, session, setSession, tweaks, onBack, onPrompter }) {
  const canvasRef = useRefRec(null);
  const videoRef = useRefRec(null);
  const data = useMemoRec(() => tokenize(script.body), [script]);
  const [prog, setProg] = useStateRec({ frac: 0, elapsed: 0, total: 1, cue: -1 });
  const [cam, setCam] = useStateRec('pending'); // pending | live | off
  const [aspect, setAspect] = useStateRec('16:9');
  const [grid, setGrid] = useStateRec(true);
  const [recState, setRecState] = useStateRec('idle'); // idle | countdown | recording
  const [count, setCount] = useStateRec(3);
  const [recSecs, setRecSecs] = useStateRec(0);
  const [takes, setTakes] = useStateRec([]);
  const [res, setRes] = useStateRec('');          // real resolution badge, e.g. "1280×720 · 30fps"
  const [playTake, setPlayTake] = useStateRec(null); // take currently open in the playback overlay
  const recTimer = useRefRec(null);
  const cdTimer = useRefRec(null);

  // recording pipeline
  const streamRef = useRefRec(null);   // live camera+mic stream (shared by preview + recorder)
  const mediaRecRef = useRefRec(null); // active MediaRecorder
  const chunksRef = useRefRec([]);     // collected encoded chunks
  const recSecsRef = useRefRec(0);     // duration counter (ref, avoids stale closure in onstop)

  // device lists + selections
  const [videoDevices, setVideoDevices] = useStateRec([]);
  const [audioDevices, setAudioDevices] = useStateRec([]);
  const [videoDev, setVideoDev] = useStateRec(''); // deviceId of selected camera
  const [audioDev, setAudioDev] = useStateRec(''); // deviceId of selected mic

  useKeyboard(session, setSession, canvasRef);

  // Enumerate devices — called after getUserMedia so labels are populated
  async function refreshDevices() {
    try {
      const all = await navigator.mediaDevices.enumerateDevices();
      setVideoDevices(all.filter(d => d.kind === 'videoinput'));
      setAudioDevices(all.filter(d => d.kind === 'audioinput'));
    } catch (_) {}
  }

  // webcam — re-runs when the user picks a different camera or mic.
  // Captures video AND audio so the MediaRecorder has a real A/V source.
  useEffectRec(() => {
    let stream;
    let cancelled = false;
    setCam('pending');
    // If getUserMedia hangs (macOS permission not granted), fall back after 2 s
    const timeout = setTimeout(() => {
      if (!cancelled) { setCam('off'); refreshDevices(); }
    }, 2000);
    (async () => {
      try {
        const videoConstraint = videoDev ? { deviceId: { exact: videoDev } } : { facingMode: 'user' };
        const audioConstraint = audioDev ? { deviceId: { exact: audioDev } } : true;
        try {
          stream = await navigator.mediaDevices.getUserMedia({ video: videoConstraint, audio: audioConstraint });
        } catch (errAV) {
          // mic blocked → retry video-only so the preview still works (recording will be silent)
          stream = await navigator.mediaDevices.getUserMedia({ video: videoConstraint, audio: false });
        }
        clearTimeout(timeout);
        await refreshDevices(); // labels now available
        if (cancelled) { stream.getTracks().forEach(t => t.stop()); return; }
        streamRef.current = stream;
        // real resolution badge from the live video track
        const vt = stream.getVideoTracks()[0];
        const st = vt && vt.getSettings ? vt.getSettings() : {};
        if (st.width && st.height) {
          setRes(`${st.width}×${st.height}${st.frameRate ? ` · ${Math.round(st.frameRate)}fps` : ''}`);
        }
        if (videoRef.current) {
          videoRef.current.srcObject = stream;
          await videoRef.current.play().catch(() => {});
          setCam('live');
        }
      } catch (e) {
        clearTimeout(timeout);
        if (!cancelled) { setCam('off'); refreshDevices(); }
      }
    })();
    return () => {
      cancelled = true;
      clearTimeout(timeout);
      if (stream) stream.getTracks().forEach(t => t.stop());
      streamRef.current = null;
    };
  }, [videoDev, audioDev]);

  function startCountdown() {
    canvasRef.current && canvasRef.current.restart();
    setRecState('countdown');
    let c = 3; setCount(c);
    cdTimer.current = setInterval(() => {
      c -= 1;
      if (c <= 0) { clearInterval(cdTimer.current); setCount(0); beginRecording(); }
      else setCount(c);
    }, 800);
  }
  function beginRecording() {
    setRecState('recording'); setRecSecs(0); recSecsRef.current = 0;
    setSession(s => ({ ...s, playing: true }));
    recTimer.current = setInterval(() => { recSecsRef.current += 1; setRecSecs(recSecsRef.current); }, 1000);

    // start a real MediaRecorder on the live stream
    const stream = streamRef.current;
    if (stream && typeof MediaRecorder !== 'undefined') {
      try {
        const mime = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm']
          .find(m => MediaRecorder.isTypeSupported(m)) || '';
        const rec = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
        chunksRef.current = [];
        const id = Date.now();
        rec.ondataavailable = (e) => { if (e.data && e.data.size) chunksRef.current.push(e.data); };
        rec.onstop = () => {
          const blob = new Blob(chunksRef.current, { type: rec.mimeType || 'video/webm' });
          const url = URL.createObjectURL(blob);
          setTakes(t => [{ id, dur: recSecsRef.current, accent: script.accent, url, size: blob.size }, ...t].slice(0, 6));
        };
        rec.start();
        mediaRecRef.current = rec;
      } catch (e) { mediaRecRef.current = null; }
    }
  }
  function stopRecording() {
    clearInterval(recTimer.current);
    setSession(s => ({ ...s, playing: false }));
    const rec = mediaRecRef.current;
    if (rec && rec.state !== 'inactive') {
      try { rec.stop(); } catch (e) {} // onstop builds the take with the recorded file
      mediaRecRef.current = null;
    } else {
      // no recorder (camera/mic off) → still log a take, just without media
      setTakes(t => [{ id: Date.now(), dur: recSecsRef.current, accent: script.accent, url: null, size: 0 }, ...t].slice(0, 6));
    }
    setRecState('idle');
  }
  function onRecButton() {
    if (recState === 'idle') startCountdown();
    else if (recState === 'recording') stopRecording();
    else { clearInterval(cdTimer.current); setRecState('idle'); }
  }
  useEffectRec(() => () => {
    clearInterval(recTimer.current); clearInterval(cdTimer.current);
    const rec = mediaRecRef.current;
    if (rec && rec.state !== 'inactive') { try { rec.stop(); } catch (e) {} }
  }, []);

  const ratio = ASPECTS.find(a => a.id === aspect).ratio;

  return (
    <div style={{ position: 'relative', height: '100%', background: '#0b0d12', overflow: 'hidden', minHeight: 0 }}>

      <div style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>

          <PrompterCanvas

            align="center" maxWidth={tweaks.maxWidth}

            variant="camera"

            onActiveCue={(ci) => setProg(p => ({ ...p, cue: ci }))}

          />
        </div>
      </div>

      {/* top toolbar */}
      <div style={{
        position: 'absolute', top: 0, left: 0, right: 0, zIndex: 30,

          fontSize={session.fontSize} onFont={(f) => setSession(s => ({ ...s, fontSize: f }))}
          elapsed={prog.elapsed} total={prog.total} fraction={prog.frac} fmt={fmtTime}

      {playTake && (
        <div onClick={() => setPlayTake(null)} style={{
          position: 'absolute', inset: 0, zIndex: 60, display: 'flex', flexDirection: 'column',
          alignItems: 'center', justifyContent: 'center', gap: 14, padding: 28,
          background: 'rgba(0,0,0,0.82)', backdropFilter: 'blur(6px)', WebkitBackdropFilter: 'blur(6px)',
        }}>
          <video onClick={(e) => e.stopPropagation()} src={playTake.url} controls autoPlay
            style={{ maxWidth: '80%', maxHeight: '72%', borderRadius: 10, background: '#000',
              boxShadow: '0 24px 64px rgba(0,0,0,0.6)' }} />
          <div onClick={(e) => e.stopPropagation()} style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
            <a href={playTake.url} download={`${script.title.replace(/[^\w]+/g, '-').toLowerCase()}-take.webm`}

              display: 'inline-flex', alignItems: 'center', gap: 7, border: '1px solid rgba(255,255,255,0.22)',
              fontFamily: 'var(--font-mono)', fontSize: 13, fontWeight: 500, color: '#fff',

function glassBtn(active) {

    width: 32, height: 32, borderRadius: 'var(--r-input)', cursor: 'pointer',
    display: 'inline-flex', alignItems: 'center', justifyContent: 'center',

}

function DeviceSelect({ icon, devices, value, onChange, fallback }) {

    if (!open) return;

    return () => document.removeEventListener('mousedown', away);
  }, [open]);

  const current = devices.find(d => d.deviceId === value);
  // trim long device labels (e.g. "FaceTime HD Camera (Built-in)") to fit the pill
  const shortLabel = (current?.label || fallback).replace(/ \(.*\)$/, '').replace(/^Default - /, '') || fallback;

  const pillStyle = {
    display: 'inline-flex', alignItems: 'center', gap: 6,

    cursor: hasChoice ? 'pointer' : 'default', userSelect: 'none',

  return (
    <div ref={wrapRef} style={{ position: 'relative' }}>
      <div onClick={() => hasChoice && setOpen(o => !o)} style={pillStyle}>
        <Icon name={icon} size={13} />

        {hasChoice && <Icon name="chevron" size={11} style={{ opacity: 0.55, marginLeft: 1 }} />}
      </div>
      {open && (
        <div style={{
          position: 'absolute', top: 'calc(100% + 6px)', left: 0, zIndex: 200,
          background: '#1c1f2b', border: '1px solid rgba(255,255,255,0.13)',
          borderRadius: 10, padding: 4, minWidth: 210,
          boxShadow: '0 10px 36px rgba(0,0,0,0.7)',
        }}>
          {devices.map(d => {
            const lbl = d.label.replace(/ \(.*\)$/, '').replace(/^Default - /, '') || `Device ${d.deviceId.slice(0, 6)}`;
            const active = d.deviceId === value || (!value && d.deviceId === devices[0]?.deviceId);
            return (
              <button key={d.deviceId} onClick={() => { onChange(d.deviceId); setOpen(false); }} style={{
                display: 'flex', alignItems: 'center', gap: 8, width: '100%', textAlign: 'left',
                fontFamily: 'var(--font-mono)', fontSize: 12,
                color: active ? '#fff' : 'rgba(255,255,255,0.65)',

                {!active && <span style={{ width: 6, flexShrink: 0 }} />}
                {lbl}
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

const CameraPlaceholder = React.forwardRef(function CameraPlaceholder({ state, mirror }, ref) {
  return (
    <div style={{ position: 'absolute', inset: 0, background:
      'radial-gradient(120% 90% at 50% 28%, #2a2f3d 0%, #161a24 55%, #0b0d12 100%)',
      display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
      {/* hidden video kept for ref consistency */}
      <video ref={ref} style={{ display: 'none' }} />
      {/* subject framing guide */}

        transform: 'translateY(6%)' }}>
        <div style={{ width: 150, height: 188, borderRadius: '50% 50% 48% 48% / 56% 56% 44% 44%',
          border: '2px dashed rgba(255,255,255,0.22)' }} />
        <div style={{ textAlign: 'center', fontFamily: 'var(--font-mono)', color: 'rgba(255,255,255,0.55)' }}>
          <div style={{ fontSize: 13, color: 'rgba(255,255,255,0.8)', marginBottom: 4 }}>
            {state === 'off' ? 'Camera unavailable' : 'Connecting to camera…'}
          </div>
          <div style={{ fontSize: 11.5 }}>
            {state === 'off' ? 'Allow camera access to see your framing.' : 'One moment.'}
          </div>
        </div>
      </div>
    </div>
  );
});

function FramingMask({ ratio, grid }) {
  const ref = useRefRec(null);
  const [box, setBox] = useStateRec(null);
  useEffectRec(() => {
    function compute() {
      const el = ref.current; if (!el) return;
      const W = el.clientWidth, H = el.clientHeight;
      let w = W, h = W / ratio;
      if (h > H) { h = H; w = H * ratio; }
      // leave a margin
      const scale = 0.9; w *= scale; h *= scale;
      setBox({ w, h, left: (W - w) / 2, top: (H - h) / 2 });
    }
    compute();
    const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(compute) : null;
    if (ro && ref.current) ro.observe(ref.current);
    window.addEventListener('resize', compute);
    return () => { ro && ro.disconnect(); window.removeEventListener('resize', compute); };
  }, [ratio]);
  return (
    <div ref={ref} style={{ position: 'absolute', inset: 0, zIndex: 15, pointerEvents: 'none' }}>
      {box && (
        <div style={{ position: 'absolute', left: box.left, top: box.top, width: box.w, height: box.h,
          boxShadow: '0 0 0 9999px rgba(0,0,0,0.45)', border: '1px solid rgba(255,255,255,0.35)', borderRadius: 2 }}>
          {grid && <>
            {[1, 2].map(i => <div key={'v' + i} style={{ position: 'absolute', top: 0, bottom: 0, left: `${(i * 100) / 3}%`, width: 1, background: 'rgba(255,255,255,0.22)' }} />)}
            {[1, 2].map(i => <div key={'h' + i} style={{ position: 'absolute', left: 0, right: 0, top: `${(i * 100) / 3}%`, height: 1, background: 'rgba(255,255,255,0.22)' }} />)}
          </>}
        </div>
      )}
    </div>
  );
}

Object.assign(window, { RecordingScreen });

})();
</script>

      if (e.data?.type === '__edit_mode_dismissed') setTweakOpen(false);
    };
    window.addEventListener('message', h);
    return () => window.removeEventListener('message', h);
  }, []);

  const toggleTweaks = () => {
    const next = !tweakOpen;
    setTweakOpen(next);
    window.postMessage({ type: next ? '__activate_edit_mode' : '__deactivate_edit_mode' }, '*');
  };

  const go = (v, s) => {
    setSession(prev => ({ ...prev, playing: false }));
    if (s) setScript(s);
    setView(v);
  };

  const addScript = (newScript) => {
    const updated = [...userScripts, newScript];
    setUserScripts(updated);
    saveUserScripts(updated);
  };

  const deleteScript = (id) => {
    // Only allow deleting user-created scripts
    const updated = userScripts.filter(s => s.id !== id);
    setUserScripts(updated);
    saveUserScripts(updated);
  };

  const tweaks = {
    focusStyle: t.focusStyle, focusColor: t.focusColor, focusPct: t.focusPct,
    lineHeight: t.lineHeight, maxWidth: t.maxWidth, align: t.align,
  };

  const titleText = view === 'library' ? null : (script ? script.title : null);
  const isRecord = view === 'record';

  const titleBarStyle = {
    height: 44, flexShrink: 0, display: 'flex', alignItems: 'center', gap: 14,
    padding: '0 16px 0 80px', // 80px left = room for macOS traffic lights
    borderBottom: `1px solid ${isRecord ? 'rgba(255,255,255,0.06)' : 'var(--border-faint)'}`,
    background: isRecord ? '#0b0d12' : 'var(--paper)',
    position: 'relative', zIndex: 5,
    WebkitAppRegion: 'drag',
  };

  const toolbarBtnStyle = {
    display: 'inline-flex', alignItems: 'center', gap: 6, border: 'none', cursor: 'pointer',
    background: 'transparent', padding: '4px 9px', borderRadius: 999,
    fontFamily: 'var(--font-mono)', fontSize: 12, fontWeight: 500,
    color: isRecord ? 'rgba(255,255,255,0.75)' : 'var(--ink-2)',
    WebkitAppRegion: 'no-drag',
    transition: 'background var(--dur-fast)',
  };

  return (
    <div style={{
      height: '100vh', width: '100%', boxSizing: 'border-box',
      display: 'flex', flexDirection: 'column',
      background: 'var(--paper)',
      overflow: 'hidden',
      fontFamily: 'var(--font-mono)',
    }}>
      {/* ── Title bar ── */}
      <div style={titleBarStyle}>
        {/* Centered wordmark + script title */}
        <div style={{
          position: 'absolute', left: '50%', transform: 'translateX(-50%)',
          display: 'flex', alignItems: 'center', gap: 8,
          WebkitAppRegion: 'no-drag',
        }}>
          <span style={{
            fontFamily: 'var(--font-mono)', fontWeight: 700, fontSize: 13.5,
            color: isRecord ? '#fff' : 'var(--ink-1)',
          }}>
            Cue<span style={{ color: 'var(--accent)' }}>.</span>
          </span>
          {titleText && (
            <span style={{
              fontFamily: 'var(--font-mono)', fontSize: 12.5, maxWidth: 320,
              whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
              color: isRecord ? 'rgba(255,255,255,0.5)' : 'var(--ink-3)',
            }}>
              — {titleText}
            </span>
          )}
        </div>

        {/* Spacer */}
        <div style={{ flex: 1 }} />

        {/* Right controls */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 2, WebkitAppRegion: 'no-drag' }}>
          <button
            onClick={() => setTweak('dark', !t.dark)}
            title="Toggle theme"
            style={toolbarBtnStyle}>
            <Icon name={t.dark ? 'moon' : 'sun'} size={14} />
            {t.dark ? 'Dark' : 'Light'}
          </button>
          <button
            onClick={toggleTweaks}
            title="Tweaks"
            style={{
              ...toolbarBtnStyle,
              background: tweakOpen
                ? (isRecord ? 'rgba(255,255,255,0.12)' : 'var(--accent-soft)')
                : 'transparent',
              color: tweakOpen
                ? (isRecord ? '#fff' : 'var(--accent)')
                : (isRecord ? 'rgba(255,255,255,0.75)' : 'var(--ink-2)'),
            }}>
            <Icon name="gear" size={14} /> Tweaks
          </button>
        </div>
      </div>

      {/* ── Screen content ── */}
      <div style={{ flex: 1, minHeight: 0, overflow: 'hidden' }}>
        {view === 'library' && (
          <LibraryScreen
            scripts={allScripts}
            wpm={session.wpm}
            onOpen={(s) => go('reader', s)}
            onRecord={(s) => go('record', s)}
            onAddScript={addScript}
            onDeleteScript={deleteScript}
          />
        )}
        {view === 'reader' && script && (
          <ReaderScreen
            script={script} session={session} setSession={setSession} tweaks={tweaks}
            onBack={() => go('library')} onRecord={() => go('record')}
          />
        )}
        {view === 'record' && script && (
          <RecordingScreen
            script={script} session={session} setSession={setSession} tweaks={tweaks}
            onBack={() => go('library')} onPrompter={() => go('reader')}
          />
        )}
      </div>

      {/* ── Tweaks panel (floating, toggled via title bar button) ── */}
      <TweaksPanel title="Tweaks" isOpen={tweakOpen} onClose={() => setTweakOpen(false)}>
        <TweakSection label="Theme" />
        <TweakToggle label="Dark mode" value={t.dark} onChange={(v) => setTweak('dark', v)} />
        <TweakColor label="Accent color" value={t.accent}
          options={['#2B6CFF', '#E0463B', '#1F8A5B', '#7A5AE0', '#E8902A']}
          onChange={(v) => setTweak('accent', v)} />

        <TweakSection label="Reading view" />
        <TweakRadio label="Focus marker" value={t.focusStyle}
          options={['line', 'arrows', 'bar', 'off']} onChange={(v) => setTweak('focusStyle', v)} />
        <TweakColor label="Marker color" value={t.focusColor}
          options={['#2B6CFF', '#E0463B', '#1F8A5B', '#E8B23A', '#9A958C']}
          onChange={(v) => setTweak('focusColor', v)} />
        <TweakSlider label="Focus position" value={t.focusPct} min={0.2} max={0.6} step={0.02}
          onChange={(v) => setTweak('focusPct', v)} />
        <TweakSlider label="Line height" value={t.lineHeight} min={1.2} max={2} step={0.05}
          onChange={(v) => setTweak('lineHeight', v)} />
        <TweakSlider label="Column width" value={t.maxWidth} min={12} max={28} step={1} unit="em"
          onChange={(v) => setTweak('maxWidth', v)} />
        <TweakRadio label="Alignment" value={t.align}
          options={['left', 'center']} onChange={(v) => setTweak('align', v)} />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

})();
</script>




</body>
</html>
